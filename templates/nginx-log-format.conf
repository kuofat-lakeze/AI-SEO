# nginx log 格式建議
# 預設的 combined 格式已經夠 classify.py 用（含 Referer 與 User-Agent）。
# 若網站在 Cloudflare 後面，多記 CF-Connecting-IP 才能做爬蟲 IP 驗證。
#
# 放到 http {} 區塊，然後在 server {} 用 access_log /var/log/nginx/access.log aiseo;

log_format aiseo '$remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                 'cfip=$http_cf_connecting_ip rt=$request_time';

# 保留期：預設 logrotate 常常只留 14 天，做 before / after 至少要 90 天
# /etc/logrotate.d/nginx 把 rotate 14 改成 rotate 90

# Apache 對應（放到 httpd.conf / apache2.conf）：
# LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
# CustomLog /var/log/apache2/access.log combined
